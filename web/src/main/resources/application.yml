
spring:
  datasource:
    url: jdbc:p6spy:mysql://localhost:3306/pet_health?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: 1234
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver

  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      timeout: 1000  # 客户端连接超时时间
      # 连接池配置
      lettuce:
        pool:
          max-active: 200  # 连接池最大活跃连接数
          max-wait: -1     # 连接池最大阻塞等待时间
          max-idle: 10     # 连接池最大空闲连接数
          min-idle: 0      # 连接池最小空闲连接数

snowflake:
  worker-id: 0
  datacenter-id: 0

# 日志配置
logging:
  level:
    com.jacob.dao.mappers: DEBUG
    org.apache.ibatis: DEBUG
    org.springframework.jdbc: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/mybatis-sql.log
    max-size: 10MB
    max-history: 7